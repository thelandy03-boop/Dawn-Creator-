<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="xterm.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0d0e10;
      overflow: hidden;
    }
    #terminal-container {
      width: 100%;
      height: 100%;
      padding: 6px;
    }
    .xterm {
      height: 100%;
    }
    .xterm .xterm-viewport {
      background-color: #0d0e10 !important;
    }
  </style>
</head>
<body>
  <div id="terminal-container"></div>
  <script src="xterm.js"></script>
  <script>
    let seq = 0;

    // Inicializar xterm con estética Dawn Studio / Dracula
    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'block',
      fontFamily: 'JetBrains Mono, Fira Code, monospace',
      fontSize: 13,
      lineHeight: 1.2,
      theme: {
        background: '#0d0e10',
        foreground: '#e0e0e0',
        cursor: '#3d9eff',
        selectionBackground: 'rgba(61, 158, 255, 0.3)',
        black: '#1a1c1e',
        red: '#ff5555',
        green: '#50fa7b',
        yellow: '#f1fa8c',
        blue: '#3d9eff',
        magenta: '#ff79c6',
        cyan: '#8be9fd',
        white: '#bfbfbf',
        brightBlack: '#4d4d4d',
        brightRed: '#ff6e6e',
        brightGreen: '#69ff94',
        brightYellow: '#ffffa5',
        brightBlue: '#60b0ff',
        brightMagenta: '#ff92df',
        brightCyan: '#a4ffff',
        brightWhite: '#ffffff'
      }
    });

    const container = document.getElementById('terminal-container');
    term.open(container);

    // Ajuste de columnas y filas automático
    function fitTerminal() {
      const core = term._core;
      if (!core || !core._renderService) return;
      const charWidth = core._renderService.dimensions.actualCellWidth || 8;
      const charHeight = core._renderService.dimensions.actualCellHeight || 16;
      
      const cols = Math.max(10, Math.floor((window.innerWidth - 12) / charWidth));
      const rows = Math.max(4, Math.floor((window.innerHeight - 12) / charHeight));
      
      if (term.cols !== cols || term.rows !== rows) {
        term.resize(cols, rows);
        notifyQml("resize:" + cols + ":" + rows);
      }
    }

    window.addEventListener('resize', fitTerminal);
    setTimeout(fitTerminal, 100);

    // Enviar teclas a QML vía document.title
    function notifyQml(msg) {
      seq = (seq + 1) % 100000;
      document.title = "pty:" + seq + ":" + msg;
    }

    term.onData(data => {
      // Codificar UTF-8 a Base64
      const b64 = btoa(encodeURIComponent(data).replace(/%([0-9A-F]{2})/g, (match, p1) => {
        return String.fromCharCode('0x' + p1);
      }));
      notifyQml("in:" + b64);
    });

    // Función que llama QML para escribir los datos de salida del PTY
    window.writeB64 = function(b64) {
      try {
        const binStr = atob(b64);
        const len = binStr.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binStr.charCodeAt(i);
        }
        term.write(bytes);
      } catch(e) {
        console.error("Error decoding b64:", e);
      }
    };

    window.clearTerm = function() {
      term.clear();
    };

    window.focusTerm = function() {
      term.focus();
    };
  </script>
</body>
</html>
